<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FMoura Advogados — escritório de advocacia em São Paulo especializado em Direito Tributário.">
  <title>FMoura Advogados</title>

  <!-- Detecta o tipo de tela antes da pintura (o CSS usa html[data-tela]) e ativa o loader -->
  <script>
    (function () {
      var d = document.documentElement;
      window.detectarTela = function () {
        var w = window.innerWidth;
        return w <= 767 ? 'mobile' : w <= 1080 ? 'tablet' : w <= 1599 ? 'notebook' : w <= 2199 ? 'desktop' : 'wide';
      };
      d.setAttribute('data-tela', window.detectarTela());
      d.classList.add('is-loading');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="global.css">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollToPlugin.min.js"></script>

  <!-- Componentes (custom elements) -->
  <script src="components/header.js"></script>
  <script src="components/hero.js"></script>
  <script src="components/quem-somos.js"></script>
  <script src="components/socios.js"></script>
  <script src="components/atuacao.js"></script>
  <script src="components/contato.js"></script>
  <script src="components/footer.js"></script>
</head>
<body>

    <img src="image/logo-white.svg" alt="" width="220">
    <span class="preloader-bar"></span>
  </div>

  <site-header></site-header>
  <site-hero></site-hero>

  <site-atuacao></site-atuacao>

  <site-footer></site-footer>

  <script src="script.js"></script>

</body>
</html>
